<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوكال — تسوّق من محلات بلدك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.strip{border-block-end:1px solid var(--line);background:var(--raise);
  padding-block:clamp(1.5rem,3.5vw,2.5rem)}
.strip-head{display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;
  padding-inline:var(--pad);margin-block-end:clamp(1.25rem,3vw,1.75rem)}
.strip-head h2{font-size:clamp(1.05rem,.9rem + .7vw,1.4rem);font-weight:400;letter-spacing:-.022em}
.strip-head p{font-size:.8rem;opacity:.55;font-weight:300;margin-block-start:.15rem}
.strip-head a{font-size:.8rem;color:inherit;opacity:.6;text-decoration:none;
  border-block-end:1px solid currentColor;flex:none}
.strip-head a:hover{opacity:1}
#rail1{gap:clamp(1.5rem,3.5vw,3rem)}
#rail1 .item{flex:none;inline-size:clamp(88px,9vw,124px);scroll-snap-align:start}
#rail1 .item figure{block-size:clamp(72px,8vw,104px)}

.shops-rail{border-block-end:1px solid var(--line);padding-block:clamp(1.5rem,3.5vw,2.5rem)}
.shops-rail .strip-head{margin-block-end:clamp(1rem,2.5vw,1.5rem)}
#rail2{gap:1px;background:var(--line);padding:0;margin-inline:var(--pad);
  border:1px solid var(--line)}
#rail2 .shopcard{flex:none;inline-size:clamp(224px,22vw,272px);scroll-snap-align:start}

.filters{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:clamp(1.1rem,2.5vw,1.6rem) var(--pad);flex-wrap:wrap}
.filters h1{font-size:clamp(1.1rem,.95rem + .7vw,1.5rem);font-weight:400;letter-spacing:-.022em}
.filters h1 em{font-style:normal;opacity:.45;font-weight:300;font-family:var(--la);
  font-size:.8em;margin-inline-start:.5rem}
</style>
</head>
<body>

<div class="util">
  <span>توصيل في نفس اليوم — القاهرة والجيزة</span>
  <span>الدفع عند الاستلام</span>
  <span>استبدال خلال ١٤ يوم</span>
</div>

<header>
  <div class="hbar">
    <a class="mark" href="index.html">لوكال</a>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" placeholder="دوّر على قطعة أو محل…" aria-label="بحث">
    </label>
    <nav class="tools">
      <a href="categories.html"><span class="lbl">الأقسام</span></a>
      <a href="shops.html" data-mega aria-expanded="false"><span class="lbl">المحلات</span></a>
      <a href="#">السلة <span class="cart-n">٢</span></a>
    </nav>
  </div>
</header>

<section class="strip" aria-labelledby="cats">
  <div class="strip-head">
    <div>
      <h2 id="cats">الأقسام</h2>
      <p>كل قطعة على رف في محل — مش في مخزن.</p>
    </div>
    <div style="display:flex;align-items:center;gap:1.25rem">
      <a href="categories.html">كل الأقسام</a>
      <div class="arrows">
        <button type="button" data-rail="rail1" data-dir="-1" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" data-rail="rail1" data-dir="1" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
  <div class="rail" id="rail1"></div>
</section>

<section class="shops-rail" aria-labelledby="shopsh">
  <div class="strip-head">
    <div>
      <h2 id="shopsh">المحلات</h2>
      <p>محلات ليها عناوين حقيقية تقدر تعدّي عليها.</p>
    </div>
    <div style="display:flex;align-items:center;gap:1.25rem">
      <a href="shops.html">كل المحلات</a>
      <div class="arrows">
        <button type="button" data-rail="rail2" data-dir="-1" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" data-rail="rail2" data-dir="1" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
  <div class="rail" id="rail2"></div>
</section>

<div class="filters">
  <h1>كل القطع <em>٤٨٢</em></h1>
  <div class="chips">
    <button class="chip" aria-pressed="true">الكل</button>
    <button class="chip" aria-pressed="false">وصل جديد</button>
    <button class="chip" aria-pressed="false">تخفيضات</button>
    <button class="chip" aria-pressed="false">أقل سعر</button>
    <button class="chip" aria-pressed="false">قريب مني</button>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="more"><button type="button">اعرض المزيد</button></div>

<footer>
  <div class="mark">لوكال</div>
  <nav>
    <a href="categories.html">الأقسام</a><a href="shops.html">المحلات</a>
    <a href="#">انضم كمحل</a><a href="#">الشحن والاستبدال</a><a href="#">الأسئلة</a>
  </nav>
</footer>

<script src="app.js"></script>
<script>
var CATS = [['تيشيرتات','tee'],['قمصان','shirt'],['تريكو','knit'],['سويت شيرت','sweat'],
  ['بناطيل','pants'],['شورتات','shorts'],['جواكت','jacket'],['فساتين','dress'],
  ['أحذية','shoe'],['شنط','bag'],['كابات','cap'],['شرابات','socks']];
document.getElementById('rail1').innerHTML = CATS.map(function(c){
  return '<a class="item" href="categories.html"><figure><svg viewBox="0 0 120 120">'
    + SHAPES[c[1]] + '</svg></figure><b>'+c[0]+'</b></a>';
}).join('');

document.getElementById('rail2').innerHTML =
  SHOPS.slice(0, 10).map(function(s){ return shopCard(s); }).join('');

var P = [
  ['Versattire','تيشيرت قطن — أوف وايت','٤٥٠','','tee','جديد'],
  ['Dryp','تريكو صوف — كحلي','٨٩٠','١٬١٠٠','knit','خصم'],
  ['Ordinary Product','بنطلون واسع — بيچ','٧٢٠','','pants',''],
  ['Juvenile','جاكيت أوفرسايز — أسود','١٬٢٥٠','','jacket','جديد'],
  ['Plein De Vie','قميص كتان — سماوي','٦٨٠','','shirt',''],
  ['Comfowear','هودي قطن — رمادي','٧٩٠','٩٥٠','sweat','خصم'],
  ['Zedzee','سنيكرز جلد — أبيض','١٬٦٥٠','','shoe',''],
  ['Versattire','شنطة كتف — بني','٩٤٠','','bag','جديد'],
  ['Dryp','كاب قطن — أسود','٢٩٠','','cap',''],
  ['Ordinary Product','تيشيرت أوفرسايز — زيتي','٥٢٠','','tee',''],
  ['Juvenile','بنطلون كارجو — كاكي','٨٥٠','١٬٠٥٠','pants','خصم'],
  ['Plein De Vie','فستان كتان — أوف وايت','١٬١٩٠','','dress','']
];
document.getElementById('grid').innerHTML = P.map(function(p,i){
  var tag = p[5] ? '<span class="tag'+(p[5]==='خصم'?' sale':'')+'">'+p[5]+'</span>' : '';
  var was = p[3] ? '<span class="was">'+p[3]+'</span>' : '';
  return '<a class="card rv" style="--d:'+(i%4*70)+'ms" href="product.html">'
    + '<span class="thumb">'+tag+'<svg viewBox="0 0 120 120">'+SHAPES[p[4]]+'</svg>'
    + '<button class="add" type="button">أضف للسلة</button></span>'
    + '<span class="body"><span class="b">'+p[0]+'</span><span class="t">'+p[1]+'</span>'
    + '<span class="prices"><span class="now'+(p[3]?' red':'')+'">'+p[2]+' ج.م</span>'+was+'</span>'
    + '</span></a>';
}).join('');
reveal();
</script>
</body>
</html>
