<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The shops section — the gallery card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&family=Source+Code+Pro:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEBE5;--raise:#F5F4F0;--field:#F7F6F3;
  --line:#CFCBC0;--line-ink:#B3AEA1;
  --ink:#14130F;--ink2:#605F5A;--ink3:#757470;
  --green:#007950;--green-soft:#DDEBE3;--green-line:#A8C9B8;
  --quint:cubic-bezier(.22,1,.36,1);--expo:cubic-bezier(.16,1,.3,1);
  --mono:"Source Code Pro",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#E4E1D9;color:var(--ink);font:16px/1.55 "Readex Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:13px;font-weight:500;color:var(--ink2)}
.tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:clip}
.tabs button{min-height:38px;padding:0 15px;border:0;background:var(--paper);color:var(--ink2);font:inherit;font-size:13px;cursor:pointer}
.tabs button:hover{background:var(--raise)}
.tabs button[aria-selected=true]{background:var(--green);color:#fff}
.bar .end{margin-inline-start:auto;display:flex;gap:8px}
.gh{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.gh[aria-pressed=true]{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}

.stage{padding:26px 20px 80px;display:grid;place-items:start center}
.opt{width:min(1240px,100%);display:none}
.opt[data-on]{display:block}
body[data-phone] .opt{width:400px}
.frame{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px 0 28px;overflow:clip;container-type:inline-size}
.note{margin:16px 4px 0;font-size:12.5px;font-weight:300;color:var(--ink3);line-height:1.7}
.note b{font-weight:500;color:var(--ink2)}
.warn{margin:10px 4px 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--raise);font-size:12.5px;font-weight:300;color:var(--ink2);line-height:1.65}
.warn b{font-weight:600;color:var(--ink)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:0 30px 24px}
.head h2{margin:0;font-size:clamp(21px,2.8cqi,28px);font-weight:300;letter-spacing:-.03em;line-height:1.05}
.head .sub{margin:8px 0 0;font-size:13px;font-weight:300;color:var(--ink2);max-width:48ch}
.head .n{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--ink3);display:block;margin-bottom:9px}
.more{font-size:13.5px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding-bottom:3px;border-bottom:1px solid var(--ink);transition:gap .22s var(--quint),color .18s,border-color .18s}
.more:hover{gap:12px;color:var(--green);border-color:var(--green)}
body[data-phone] .head{padding-inline:18px}

/* ── the gallery card ────────────────────────────────────── */
/* Seams are drawn BY the cards, not by a coloured grid showing through the
   gaps: a last row with fewer cards than columns was painting the leftover as
   a bare grey panel. Adjacent shadows meet inside the 1px gap and read as one
   hairline; an empty remainder is simply paper. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:1px;background:var(--paper);border-block:1px solid var(--line)}
.card{background:var(--paper);text-decoration:none;color:inherit;display:grid;grid-template-rows:auto 1fr;transition:background .2s;box-shadow:0 0 0 1px var(--line)}
.card:hover{background:var(--raise)}

/* SHORTER than a portrait: a shopfront is a wide thing. */
.gal{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--field)}
.gal img{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:cover;opacity:0;transition:opacity .55s var(--expo)}
.gal img[data-on]{opacity:1}
.gal[data-none]{display:grid;place-items:center}
.gal[data-none] b{font:400 34px/1 Georgia,serif;color:var(--ink3)}

/* the logo rides the corner of the photo, on stone, never over it */
.logo{position:absolute;inset-block-end:0;inset-inline-start:0;z-index:2;inline-size:52px;block-size:52px;background:var(--paper);border-block-start:1px solid var(--line);border-inline-end:1px solid var(--line);border-start-end-radius:10px;display:grid;place-items:center;overflow:hidden;padding:7px}
.logo img{position:static;opacity:1;object-fit:contain}
.logo b{font:400 17px/1 Georgia,serif;color:var(--ink2)}

/* progress ticks: one per image, filling as it advances */
.ticks{position:absolute;z-index:2;inset-block-start:9px;inset-inline:9px;display:flex;gap:3px;opacity:0;transition:opacity .25s}
.card:hover .ticks{opacity:1}
.tick{flex:1;block-size:2px;background:rgba(247,246,243,.5);border-radius:2px;overflow:hidden}
.tick i{display:block;block-size:100%;inline-size:0;background:var(--paper)}
.tick[data-done] i{inline-size:100%}
.tick[data-run] i{animation:fill 1.15s linear forwards}
@keyframes fill{from{inline-size:0}to{inline-size:100%}}

.promo{position:absolute;z-index:2;inset-block-start:9px;inset-inline-end:9px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;background:var(--paper);border:1px solid var(--green-line);color:var(--green)}
.card:hover .promo{inset-block-start:18px}
.promo{transition:inset-block-start .25s var(--quint)}

.plate{padding:14px 16px 16px;display:grid;gap:7px;align-content:start}
.pname{font-size:16px;font-weight:500;letter-spacing:-.01em}
.pdesc{font-size:12.5px;font-weight:300;color:var(--ink2);line-height:1.45}
.fig{display:flex;gap:18px;margin-top:2px}
.fig div{display:grid;gap:1px}
.fig dt{font-size:10px;font-weight:300;color:var(--ink3)}
.fig dd{margin:0;font-family:var(--mono);font-size:14px;font-weight:600;line-height:1;white-space:nowrap}
.fig dd small{font-family:"Readex Pro",sans-serif;font-size:9.5px;font-weight:300;color:var(--ink3);margin-inline-start:2px}
.go{font-size:12px;color:var(--green);opacity:0;translate:0 4px;transition:opacity .2s,translate .24s var(--quint)}
.card:hover .go{opacity:1;translate:0 0}

/* ── V2 · plate slides over the photo ────────────────────── */
.v2 .gal{aspect-ratio:16/11}
.v2 .plate{position:absolute;inset-inline:0;inset-block-end:0;z-index:3;background:var(--paper);border-block-start:1px solid var(--line);translate:0 calc(100% - 52px);transition:translate .4s var(--quint)}
.v2 .card{position:relative;grid-template-rows:1fr}
.v2 .card:hover .plate{translate:0 0}
.v2 .logo{inset-block-end:auto;inset-block-start:0;border-block-start:0;border-block-end:1px solid var(--line);border-start-end-radius:0;border-end-end-radius:10px}

/* ── V3 · filmstrip ──────────────────────────────────────── */
.v3 .strip{display:flex;gap:2px;padding:0 16px 14px}
.v3 .thumb{flex:1;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--field);opacity:.55;transition:opacity .2s,border-color .2s}
.v3 .thumb img{inline-size:100%;block-size:100%;object-fit:cover}
.v3 .thumb[data-on]{opacity:1;border-color:var(--green)}
.v3 .thumb[data-empty]{display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink3)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.gal img[data-first]{opacity:1}}
</style>
</head>
<body>

<div class="bar">
  <h1>The shops section — gallery card</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="end">
    <button class="gh" id="lang">EN</button>
    <button class="gh" id="phone" aria-pressed="false">400px</button>
  </div>
</div>

<div class="stage" id="stage"></div>

<script type="module">
import { SHOPS } from "./shops.js";

let AR = true;
const T = (a, e) => (AR ? a : e);
const ds = (s) => (AR ? s.ar : s.en) || "";
const num = (v) => (v == null ? null : Math.round(Number(v)));

/* A shop's gallery: its own cover is slot 1 and is REQUIRED; slots 2-5 are
   optional. The wire carries one cover today, so the extra slots here are
   filled with the other shops' covers purely to show the motion. */
const covers = SHOPS.filter((s) => s.cover).map((s) => s.cover);
const galleryOf = (s) => {
  if (!s.cover) return [];
  const others = covers.filter((c) => c !== s.cover);
  return [s.cover, ...others].slice(0, 5);
};

const figures = (s) => `<dl class="fig">
  <div><dt>${T("التوصيل","Delivery")}</dt><dd>${num(s.fee) ?? "—"}${num(s.fee)!=null?`<small>${T("ج.م","EGP")}</small>`:""}</dd></div>
  <div><dt>${T("أقل أوردر","Minimum")}</dt><dd>${num(s.min) ?? "—"}${num(s.min)!=null?`<small>${T("ج.م","EGP")}</small>`:""}</dd></div>
  <div><dt>${T("مرتجع","Returns")}</dt><dd>${s.ret}<small>${T("يوم","d")}</small></dd></div>
</dl>`;

const logo = (s) => `<span class="logo">${
  s.logo ? `<img src="${s.logo}" alt="" loading="lazy">` : `<b>${s.name.trim()[0]}</b>`
}</span>`;

const gallery = (s) => {
  const set = galleryOf(s);
  /* No photo: the mark stands alone and centred. Drawing the corner notch too
     would print the same initial twice on the same card. */
  if (!set.length) return `<span class="gal" data-none><b>${s.name.trim()[0]}</b></span>`;
  return `<span class="gal" data-count="${set.length}">
    ${set.map((u, i) => `<img src="${u}" alt="" loading="lazy" ${i ? "" : "data-on data-first"}>`).join("")}
    <span class="ticks">${set.map((_, i) => `<span class="tick"${i ? "" : " data-done"}><i></i></span>`).join("")}</span>
    ${s.promo ? `<span class="promo">${T("مموّل","Promoted")}</span>` : ""}
    ${logo(s)}</span>`;
};

const plate = (s) => `<span class="plate">
  <span class="pname">${s.name}</span>
  ${ds(s) ? `<span class="pdesc">${ds(s)}</span>` : ""}
  ${figures(s)}
  <span class="go">${T("افتح المحل ›","Open the shop ›")}</span></span>`;

const head = () => `<div class="head"><div>
  <span class="n">${SHOPS.length} ${T("محل","SHOPS")}</span>
  <h2>${T("محلات ليها عنوان تقدر تعدّي عليه","Shops with an address you could walk to")}</h2>
  <p class="sub">${T("كل محل بيراجع الرف بنفسه، وبيبعت نصّه لوحده، وبفلوسه وتوصيله هو.","Each shop checks its own shelf, sends its own half, and sets its own fee.")}</p></div>
  <a class="more" href="#">${T("كل المحلات","All shops")} <span>‹</span></a></div>`;

const V1 = () => `<div class="frame">${head()}<div class="grid">${SHOPS.map(s => `
  <a class="card" href="#">${gallery(s)}${plate(s)}</a>`).join("")}</div></div>`;

const V2 = () => `<div class="frame v2">${head()}<div class="grid">${SHOPS.map(s => `
  <a class="card" href="#">${gallery(s)}${plate(s)}</a>`).join("")}</div></div>`;

const V3 = () => `<div class="frame v3">${head()}<div class="grid">${SHOPS.map(s => {
  const set = galleryOf(s);
  return `<a class="card" href="#">${gallery(s)}${plate(s)}
    <span class="strip">${Array.from({length:5},(_,i)=>
      set[i] ? `<span class="thumb"${i?"":" data-on"}><img src="${set[i]}" alt="" loading="lazy"></span>`
             : `<span class="thumb" data-empty>${i+1}</span>`).join("")}</span></a>`;
}).join("")}</div></div>`;

const OPTS = [
 ["1 · Band", V1, `<b>Shorter photo, plate underneath.</b> The image is 16:10 — a shopfront is a wide thing, and the portrait band was eating the section. The logo sits in the photo's corner on a stone notch rather than floating over the picture, so it never fights the photograph behind it. Hover and the gallery advances by itself, about a second an image, with ticks along the top counting the set.`],
 ["2 · Reveal", V2, `<b>The plate rides over the photo.</b> At rest you see the name only; hovering slides the whole plate up over the image to show what it sells and what it charges. Gives the photograph more of the card and keeps the grid quieter, at the cost of hiding the figures until someone reaches for them — which on a phone means they are never seen, since there is no hover.`],
 ["3 · Filmstrip", V3, `<b>The set is visible, not implied.</b> Five thumbnails under the plate: the filled ones are the shop's photos, the numbered outlines are the slots it has not used. It tells a shop owner exactly what is missing, which makes it as much a nudge to upload as a card — and it is the busiest of the three.`]
];

const tabs = document.getElementById("tabs"), stage = document.getElementById("stage");
let cur = 0;
tabs.innerHTML = OPTS.map(([l], i) => `<button role="tab" aria-selected="${!i}" data-i="${i}">${l}</button>`).join("");
tabs.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; cur = +b.dataset.i; for (const x of tabs.children) x.ariaSelected = String(+x.dataset.i === cur); draw(); };
document.getElementById("lang").onclick = (e) => { AR = !AR; document.documentElement.lang = AR ? "ar" : "en"; document.documentElement.dir = AR ? "rtl" : "ltr"; e.target.textContent = AR ? "EN" : "عربي"; draw(); };
document.getElementById("phone").onclick = (e) => { const on = e.target.ariaPressed !== "true"; e.target.ariaPressed = String(on); document.body.toggleAttribute("data-phone", on); draw(); };

/* Auto-advance on hover. Stops and rewinds on leave, so a card always starts
   from the shop's own required photo rather than wherever it was left. */
const STEP = 1150;
function wire() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const card of stage.querySelectorAll(".card")) {
    const shots = [...card.querySelectorAll(".gal > img")];
    const ticks = [...card.querySelectorAll(".tick")];
    const strip = [...card.querySelectorAll(".thumb")];
    if (shots.length < 2 || reduce) continue;
    let at = 0, timer;
    const show = (n) => {
      shots.forEach((im, i) => im.toggleAttribute("data-on", i === n));
      ticks.forEach((t, i) => {
        t.removeAttribute("data-run"); t.removeAttribute("data-done");
        if (i < n) t.setAttribute("data-done", "");
        if (i === n) { void t.offsetWidth; t.setAttribute("data-run", ""); }
      });
      strip.forEach((t, i) => t.toggleAttribute("data-on", i === n));
    };
    card.addEventListener("pointerenter", () => {
      clearInterval(timer);
      show(at);
      timer = setInterval(() => { at = (at + 1) % shots.length; show(at); }, STEP);
    });
    card.addEventListener("pointerleave", () => {
      clearInterval(timer); at = 0;
      shots.forEach((im, i) => im.toggleAttribute("data-on", i === 0));
      ticks.forEach((t, i) => { t.removeAttribute("data-run"); t.toggleAttribute("data-done", i === 0); });
      strip.forEach((t, i) => t.toggleAttribute("data-on", i === 0));
    });
  }
}
function draw() {
  stage.innerHTML = `<section class="opt" data-on>${OPTS[cur][1]()}
    <p class="note">${OPTS[cur][2]}</p>
    <p class="warn"><b>The backend does not have this yet.</b> A brand carries one <code>logoMediaId</code> and one <code>coverMediaId</code> — there is no gallery. Slots 2–5 in this mockup are the other shops' covers, shown only to demonstrate the motion. Making it real needs a <code>BrandMedia</code> join (brandId, mediaId, sortOrder) shaped like <code>ProductMedia</code>, the field on <code>publicBrandSchema</code>, and an upload strip on the brand's dashboard profile — with slot 1 required and 2–5 optional, exactly as asked.</p>
  </section>`;
  wire();
}
draw();
</script>
</body>
</html>
